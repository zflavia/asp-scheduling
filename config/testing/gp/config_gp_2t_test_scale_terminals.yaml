##############################################################################
###                               Testing                                  ###
##############################################################################
# (R) [str] Type of your scheduling problem - this template is for the asp
sp_type: asp
# (R)   [string]  GP algorithm you want to use
algorithm: gp-2trees
# (R)   [string]  Test Environment: Should be the same the agent was trained on
environment: env_gp
# (O)   [string]  Name of the model you want to load for testing
saved_model_name: gp_2t_ASPTrain_optunaParam_scaled_terminals
# (R)   [int]     Seed for all pseudo random generators (random, numpy, torch) [0,200,400,600]
seed: [0,200,400,600,800,1000,1500, 2000, 2500, 3000]
# (R)   [string]  Set an individual description that you can identify this
# training run  more easily later on. This will be used in
# "weights and biases" as well
config_description: gp_dr_ASPTrain_optunaParam
# (O)   [string]  Set a directory from where you want to load the agent model
experiment_save_path: models/gp/train_using_scaled_terminals/

# (0) [string] Evaluate using only the best element (best), or using an assemble (assemble), or assemble-instances
evaluation_type: best
# (R)   [string]  Path to the file with generated data that to be used for test asp/ds_ASP_wide.pkl ds_variants_deep_test.pkl
instances_file: asp/ds_ASP_fjsspHurink_vdata.pkl
# (0) [string] Save experiments gp path
experiment_result_path: results/fjssp-la/train_using_scaled_terminals/result_gp_2t_best
